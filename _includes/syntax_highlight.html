{% if page.disable_syntax_highlight != true %}
<!-- CDN 优先（国内镜像），失败时回落到仓库内同名脚本 -->
<script defer src="https://cdn.jsdmirror.com/gh/xiaochopin/xiaochopin.github.io@main/assets/scripts/highlight.pack.js"
        onerror="var s=document.createElement('script');s.src='{{ '/assets/scripts/highlight.pack.js' | relative_url }}';s.onload=function(){if(window.__hljsReady)window.__hljsReady();};document.head.appendChild(s);"></script>
<script defer src="https://cdn.jsdmirror.com/gh/xiaochopin/xiaochopin.github.io@main/assets/scripts/code-copy.js"
        onerror="var s=document.createElement('script');s.src='{{ '/assets/scripts/code-copy.js' | relative_url }}';document.head.appendChild(s);"></script>
{% endif %}
