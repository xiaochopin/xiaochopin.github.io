content:
  - name: posts
    label: 文章
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{others.title}.md"
    fields:
      - name: title
        label: 标题
        type: string
        required: true

      - name: description
        label: 描述/副标题
        type: string
        required: false

      - name: tags
        label: 标签
        type: string
        list: true

      - name: layout
        label: 布局
        type: string
        default: post
        hidden: true

      - name: body
        label: 正文内容
        type: rich-text
        required: true
    others:
      - name: title
        label: 文件中的标题
        type: string
        required: true